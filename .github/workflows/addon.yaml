# Builds the add-on for every supported architecture and publishes it to GHCR.
#
# This is optional. With no published image the Supervisor builds the add-on on
# the device itself, which takes a couple of minutes on a Pi 4 and needs no CI
# at all. Publishing here makes installs a fast pull instead, which is how the
# community and official add-on repositories ship.
#
# To switch over, add this line to addon/config.yaml once the first run has
# pushed images:
#
#   image: ghcr.io/aurora-silicon/aurorairc-{arch}
#
name: Build add-on

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, amd64, armv7]
    steps:
      - uses: actions/checkout@v4

      - name: Read the add-on version
        id: meta
        run: |
          echo "version=$(grep '^version:' addon/config.yaml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: addon
          platforms: ${{ matrix.arch == 'aarch64' && 'linux/arm64' || matrix.arch == 'armv7' && 'linux/arm/v7' || 'linux/amd64' }}
          push: true
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base:latest
            AURORAIRC_REF=v${{ steps.meta.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/aurorairc-${{ matrix.arch }}:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/aurorairc-${{ matrix.arch }}:latest
